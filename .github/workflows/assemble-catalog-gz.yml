name: Assemble catalog.json.gz

on:
  push:
    branches:
      - "cursor/discover-app-extras-5dc7"
      - "cursor/lantern-vendor-catalog-5dc7"
    paths:
      - "packages/smartfind/data/_gz_b64/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble gzip from base64 parts
        run: |
          set -euo pipefail
          test -d packages/smartfind/data/_gz_b64
          cat $(ls packages/smartfind/data/_gz_b64/*.b64 | sort) | base64 -d > packages/smartfind/data/catalog.json.gz
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          raw = gzip.decompress(Path("packages/smartfind/data/catalog.json.gz").read_bytes())
          import json
          cat = json.loads(raw)
          print("entries", cat.get("count"), "file", Path("packages/smartfind/data/catalog.json.gz").stat().st_size)
          assert cat.get("count", 0) > 1000
          PY
          rm -rf packages/smartfind/data/_gz_b64
          rm -f packages/smartfind/data/.gzip-probe.gz
          rm -f packages/smartfind/data/catalog.json
          rm -f .github/workflows/assemble-catalog-gz.yml

      - name: Commit assembled catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/smartfind/data .github/workflows/assemble-catalog-gz.yml || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Ship full Lantern vendor catalog and fix search ranking"
          git push
