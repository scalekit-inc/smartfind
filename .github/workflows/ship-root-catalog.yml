name: Ship root catalog gz

on:
  push:
    branches:
      - cursor/lantern-vendor-catalog-5dc7
      - cursor/discover-app-extras-5dc7
    paths:
      - ".github/workflows/ship-root-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ship-root-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Patch DiscoverApp vendor pills + copy catalog gz
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("src/components/DiscoverApp.tsx")
          t = p.read_text()
          pat = re.compile(
              r"  const vendorCounts = \{\n"
              r"    epic: catalogMeta\?\.vendors\.epic \|\| 0,\n"
              r"    oracle: catalogMeta\?\.vendors\[\"oracle-health\"\] \|\| 0,\n"
              r"    athena: catalogMeta\?\.vendors\.athena \|\| 0,\n"
              r"    advancedmd: catalogMeta\?\.vendors\.advancedmd \|\| 0,\n"
              r"    eclinicalworks: catalogMeta\?\.vendors\.eclinicalworks \|\| 0,\n"
              r"    veradigm: catalogMeta\?\.vendors\.veradigm \|\| 0,\n"
              r"  \};",
              re.M,
          )
          new = (
              "  const vendorCounts = catalogMeta\n"
              "    ? {\n"
              "        epic: catalogMeta.vendors.epic || 0,\n"
              "        oracle: catalogMeta.vendors[\"oracle-health\"] || 0,\n"
              "        athena: catalogMeta.vendors.athena || 0,\n"
              "        advancedmd: catalogMeta.vendors.advancedmd || 0,\n"
              "        eclinicalworks: catalogMeta.vendors.eclinicalworks || 0,\n"
              "        veradigm: catalogMeta.vendors.veradigm || 0,\n"
              "      }\n"
              "    : null;"
          )
          t2, n = pat.subn(new, t, count=1)
          print(f"vendorCounts block replacements: {n}")
          replacements = [
              ("`Epic (${vendorCounts.epic})`", 'vendorCounts ? `Epic (${vendorCounts.epic.toLocaleString()})` : "Epic"'),
              ("`Oracle Health (${vendorCounts.oracle})`", 'vendorCounts ? `Oracle Health (${vendorCounts.oracle.toLocaleString()})` : "Oracle Health"'),
              ("`athena (${vendorCounts.athena})`", 'vendorCounts ? `athena (${vendorCounts.athena.toLocaleString()})` : "athena"'),
              ("`AdvancedMD (${vendorCounts.advancedmd})`", 'vendorCounts ? `AdvancedMD (${vendorCounts.advancedmd.toLocaleString()})` : "AdvancedMD"'),
              ("`eCW (${vendorCounts.eclinicalworks})`", 'vendorCounts ? `eCW (${vendorCounts.eclinicalworks.toLocaleString()})` : "eCW"'),
              ("`Veradigm (${vendorCounts.veradigm})`", 'vendorCounts ? `Veradigm (${vendorCounts.veradigm.toLocaleString()})` : "Veradigm"'),
          ]
          for a, b in replacements:
              if a in t2:
                  t2 = t2.replace(a, b)
                  print("replaced label", a[:40])
          p.write_text(t2)
          PY
          test -f packages/smartfind/data/catalog.json.gz
          mkdir -p data public/data
          cp packages/smartfind/data/catalog.json.gz data/catalog.json.gz
          cp packages/smartfind/data/catalog.json.gz public/data/catalog.json.gz
          ls -la data/catalog.json.gz public/data/catalog.json.gz

      - name: Commit and push if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/catalog.json.gz public/data/catalog.json.gz src/components/DiscoverApp.tsx
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Ensure top-level data/catalog.json.gz for Cursor hosting"
          git push
