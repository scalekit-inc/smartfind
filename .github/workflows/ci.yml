name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build smartfind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/smartfind

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: packages/smartfind/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke — CLI search
        run: |
          node dist/cli.js search "CarolinaEast" --limit 1 | tee /tmp/search.json
          grep -q CarolinaEast /tmp/search.json

      - name: Pack dry-run
        run: npm pack --dry-run

  site:
    name: Build and lint the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Sync catalog copies for Next assets
        run: |
          mkdir -p data public/data
          cp packages/smartfind/data/catalog.json data/catalog.json
          cp packages/smartfind/data/catalog.json public/data/catalog.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
